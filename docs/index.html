<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Predictor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Placement Probability Predictor</h1>
    <p class="subtitle">Enter your details to see your predicted placement chances</p>

    <form id="predictForm">

      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" min="15" max="30" required>
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div class="form-group">
        <label for="cgpa">CGPA</label>
        <input type="number" id="cgpa" step="0.01" min="0" max="10" required>
      </div>

      <div class="form-group">
        <label for="internships">Internships</label>
        <input type="number" id="internships" min="0" required>
      </div>

      <div class="form-group">
        <label for="projects">Projects</label>
        <input type="number" id="projects" min="0" required>
      </div>

      <div class="form-group">
        <label for="codingSkills">Coding Skills (0-10)</label>
        <input type="number" id="codingSkills" min="0" max="10" required>
      </div>

      <div class="form-group">
        <label for="communicationSkills">Communication Skills (0-10)</label>
        <input type="number" id="communicationSkills" min="0" max="10" required>
      </div>

      <div class="form-group">
        <label for="aptitude">Aptitude Test Score (0-100)</label>
        <input type="number" id="aptitude" min="0" max="100" required>
      </div>

      <div class="form-group">
        <label for="softSkills">Soft Skills Rating (0-10)</label>
        <input type="number" id="softSkills" min="0" max="10" required>
      </div>

      <div class="form-group">
        <label for="certifications">Certifications</label>
        <input type="number" id="certifications" min="0" required>
      </div>

      <div class="form-group">
        <label for="backlogs">Backlogs</label>
        <input type="number" id="backlogs" min="0" required>
      </div>

      <div class="form-group">
        <label for="branch">Branch</label>
        <select id="branch" required>
          <option value="CSE">CSE</option>
          <option value="ECE">ECE</option>
          <option value="ME">ME</option>
          <option value="Civil">Civil</option>
          <option value="IT">IT</option>
        </select>
      </div>

      <div class="form-group">
        <label for="degree">Degree</label>
        <select id="degree" required>
          <option value="B.Tech">B.Tech</option>
          <option value="BCA">BCA</option>
          <option value="MCA">MCA</option>
          <option value="B.Sc">B.Sc</option>
        </select>
      </div>

      <button type="submit">Predict My Placement</button>
    </form>

    <div id="result" class="result hidden">
      <h2>Predicted Placement Probability</h2>
      <div class="probability" id="probabilityValue">--%</div>
    </div>
    <div id="skillBox" class="skill-box hidden">
      <h2>Recommended Areas to Improve</h2>
      <ul id="skillList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
